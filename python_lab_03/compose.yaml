
services:
  db:
    image: postgres:17
    container_name: sleeptracker-db

    environment:
      POSTGRES_DB: sleeptracker
      POSTGRES_USER: sleeptracker
      POSTGRES_PASSWORD: ${SLEEPTRACKER_DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleeptracker -d sleeptracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
